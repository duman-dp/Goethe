audio:
  padding_before: 0.03
  padding_after: 0.03
  bitrate: 192

paths:
  videos: ./videos
  transcripts: ./transcripts
  output: ./output
  logs: ./logs

speech:
  language: German
  model_size: tiny
  device: cpu
  quiet: false

matching:
  fuzzy_threshold: 60    # Fallback if exact not found

video_formats:
  - mp4
  - mkv
  - avi
  - mov
